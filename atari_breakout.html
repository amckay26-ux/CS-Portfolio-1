<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atari Breakout Clone</title>
    
    <style>
        /* --- CSS Styling (using Inter font and basic styling) --- */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1f2937; /* Dark background */
            font-family: 'Inter', sans-serif;
            color: #f9fafb;
        }

        h1 {
            color: #fcd34d; /* Yellow heading */
            margin-bottom: 10px;
            text-shadow: 2px 2px #000;
        }

        #gameCanvas {
            border: 4px solid #fcd34d; /* Yellow border */
            background-color: #000;
            display: block;
            box-shadow: 0 0 20px rgba(252, 211, 77, 0.5); /* Glowing effect */
            border-radius: 8px;
        }

        .info-bar {
            width: 480px; /* Match canvas width */
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 1.2em;
        }

        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 40px;
            border: 3px solid #ef4444;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 30px #ef4444;
            z-index: 100;
            display: none; /* Hidden by default */
        }
        
        .message-box h2 {
            margin-top: 0;
            color: #fcd34d;
        }
        .message-box p {
            margin: 5px 0;
        }
        .message-box button {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .message-box button:hover {
            background-color: #b91c1c;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>BREAKOUT ARCADE</h1>

    <div class="info-bar">
        <span id="score">Score: 0</span>
        <span id="lives">Lives: 3</span>
    </div>

    <canvas id="gameCanvas" width="480" height="600"></canvas>

    <div id="messageBox" class="message-box">
        <h2 id="messageTitle">Ready to Play!</h2>
        <p id="messageText">Use the mouse or left/right arrow keys to move the paddle.</p>
        <button id="startButton">Start Game</button>
    </div>

    <script>
        // --- Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const messageBox = document.getElementById('messageBox');
        const messageTitle = document.getElementById('messageTitle');
        const messageText = document.getElementById('messageText');
        const startButton = document.getElementById('startButton');

        // Game State
        let gameRunning = false;
        let score = 0;
        let lives = 3;

        // Ball Variables
        let ball = {
            x: canvas.width / 2,
            y: canvas.height - 30,
            radius: 10,
            dx: 2, // delta x
            dy: -2  // delta y
        };

        // Paddle Variables
        let paddle = {
            height: 10,
            width: 75,
            x: (canvas.width - 75) / 2,
            speed: 10, // speed of paddle movement
            rightPressed: false,
            leftPressed: false
        };

        // Brick Variables
        const brick = {
            rowCount: 5,
            columnCount: 8,
            width: 50,
            height: 15,
            padding: 8,
            offsetTop: 30,
            offsetLeft: 30
        };

        // Bricks Array (stores the grid)
        let bricks = [];
        
        // --- Initialization ---

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brick.columnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brick.rowCount; r++) {
                    // status: 1 (visible), 0 (destroyed)
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
        }

        // --- Drawing Functions ---

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#fcd34d"; // Yellow ball
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, canvas.height - paddle.height, paddle.width, paddle.height);
            ctx.fillStyle = "#3b82f6"; // Blue paddle
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brick.columnCount; c++) {
                for (let r = 0; r < brick.rowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        // Calculate brick position
                        let brickX = (c * (brick.width + brick.padding)) + brick.offsetLeft;
                        let brickY = (r * (brick.height + brick.padding)) + brick.offsetTop;
                        
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;

                        // Draw the brick
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brick.width, brick.height);
                        
                        // Color bricks based on row for variety
                        let color;
                        if (r < 1) color = "#ef4444"; // Red
                        else if (r < 2) color = "#f97316"; // Orange
                        else if (r < 3) color = "#f59e0b"; // Amber
                        else if (r < 4) color = "#10b981"; // Emerald
                        else color = "#3b82f6"; // Blue

                        ctx.fillStyle = color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        // --- Core Logic ---

        function collisionDetection() {
            for (let c = 0; c < brick.columnCount; c++) {
                for (let r = 0; r < brick.rowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        // Check if ball center is within brick bounds
                        if (ball.x > b.x && ball.x < b.x + brick.width && ball.y > b.y && ball.y < b.y + brick.height) {
                            ball.dy = -ball.dy; // Reverse vertical direction
                            b.status = 0; // Destroy the brick
                            score++;
                            scoreElement.textContent = `Score: ${score}`;

                            // Win Condition Check
                            if (score === brick.rowCount * brick.columnCount) {
                                showMessage("Level Complete!", "Congratulations! You cleared all the bricks!", true);
                                gameRunning = false;
                            }
                        }
                    }
                }
            }
        }

        function updatePaddlePosition() {
            if (paddle.rightPressed && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
            } else if (paddle.leftPressed && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }
        }

        function updateBallPosition() {
            // 1. Ball/Wall collision
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx; // Reverse horizontal direction
            }

            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy; // Reverse vertical direction (top wall)
            } else if (ball.y + ball.dy > canvas.height - ball.radius - paddle.height) {
                // 2. Ball/Paddle collision check (only check if ball is close to paddle Y position)
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    
                    // Ball hit the paddle!
                    // Calculate relative intersection point (center of paddle is 0)
                    let relativeIntersectX = (paddle.x + (paddle.width / 2)) - ball.x;
                    let normalizedRelativeIntersectionX = relativeIntersectX / (paddle.width / 2);
                    
                    // Angle rebound: Max angle is 45 degrees (PI/4) or 60 degrees (PI/3)
                    let bounceAngle = normalizedRelativeIntersectionX * (Math.PI / 3); 
                    
                    // Update velocity components based on bounce angle
                    ball.dx = ball.speed * -Math.sin(bounceAngle);
                    ball.dy = ball.speed * -Math.cos(bounceAngle);
                    
                    // Boost speed slightly (optional)
                    // ball.speed *= 1.60; 

                    // Ensure ball moves up
                    if (ball.dy > 0) ball.dy = -ball.dy;

                } else if (ball.y + ball.dy > canvas.height - ball.radius) {
                    // 3. Ball hit the floor (Missed paddle)
                    lives--;
                    livesElement.textContent = `Lives: ${lives}`;

                    if (lives === 0) {
                        showMessage("Game Over", `Your final score is ${score}.`, false);
                        gameRunning = false;
                    } else {
                        // Reset ball and paddle position for new life
                        resetBallAndPaddle();
                    }
                }
            }

            ball.x += ball.dx;
            ball.y += ball.dy;
        }
        
        function resetBallAndPaddle() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 30;
            ball.dx = 2; 
            ball.dy = -2;
            paddle.x = (canvas.width - paddle.width) / 2;
        }


        // --- Message Box / Game Control ---

        function showMessage(title, text, isWin) {
            messageTitle.textContent = title;
            messageText.textContent = text;
            
            startButton.textContent = "Play Again";
            if (isWin) {
                startButton.style.backgroundColor = '#10b981'; // Green for win
                startButton.style.boxShadow = '0 0 10px #10b981';
            } else {
                startButton.style.backgroundColor = '#ef4444'; // Red for loss
                startButton.style.boxShadow = '0 0 10px #ef4444';
            }
            messageBox.style.display = 'block';
        }

        function startGame() {
            score = 0;
            lives = 3;
            scoreElement.textContent = `Score: ${score}`;
            livesElement.textContent = `Lives: ${lives}`;
            
            messageBox.style.display = 'none';
            gameRunning = true;
            
            // Set initial ball speed for consistent behavior
            ball.speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy); 

            initBricks();
            resetBallAndPaddle();
            gameLoop();
        }

        // --- Event Handlers ---

        document.addEventListener("keydown", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") {
                paddle.rightPressed = true;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                paddle.leftPressed = true;
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") {
                paddle.rightPressed = false;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                paddle.leftPressed = false;
            }
        });
        
        // Mouse control for paddle (more natural experience)
        canvas.addEventListener("mousemove", (e) => {
            const relativeX = e.clientX - canvas.offsetLeft;
            if (relativeX > paddle.width / 2 && relativeX < canvas.width - paddle.width / 2) {
                paddle.x = relativeX - paddle.width / 2;
            }
        });

        startButton.addEventListener('click', startGame);

        // --- Main Game Loop ---

        function gameLoop() {
            if (!gameRunning) return;

            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw
            drawBricks();
            drawBall();
            drawPaddle();

            // 2. Logic
            collisionDetection();
            updatePaddlePosition();
            updateBallPosition();
            
            requestAnimationFrame(gameLoop);
        }

        // Show initial message box on load
        window.onload = function() {
            // Check if ball.speed needs initial calculation if gameLoop hasn't run
            ball.speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy); 
            initBricks();
            showMessage("Welcome!", "Use your mouse or arrow keys to move the paddle.", false);
        };

    </script>
</body>
</html>
