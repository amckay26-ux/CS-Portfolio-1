<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-File Tic-Tac-Toe</title>
    
    <style>
        /* --- CSS Styling from style.css --- */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .container {
            text-align: center;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        #status {
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #555;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 0 auto;
            background-color: #333;
            border: 5px solid #333;
            border-radius: 8px;
        }

        .cell {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            user-select: none; /* Prevent text selection */
        }

        .cell:hover:not(.x):not(.o) {
            background-color: #e0e0e0;
        }

        .x {
            color: #d9534f; /* Red */
        }

        .o {
            color: #5cb85c; /* Green */
        }

        #resetButton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #resetButton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <div id="status">Player X's turn</div>
        <div class="board" id="gameBoard">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button id="resetButton">Reset Game</button>
    </div>

    <script>
        // --- JavaScript Logic from script.js ---

        // Game State Variables
        let board = ['', '', '', '', '', '', '', '', '']; // Represents the 9 cells
        let currentPlayer = 'X';
        let isGameActive = true;

        // DOM Element References
        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');
        const resetButton = document.getElementById('resetButton');

        // Winning Combinations (indices of the board array)
        const winningConditions = [
            [0, 1, 2], // Top row
            [3, 4, 5], // Middle row
            [6, 7, 8], // Bottom row
            [0, 3, 6], // Left column
            [1, 4, 7], // Middle column
            [2, 5, 8], // Right column
            [0, 4, 8], // Diagonal (top-left to bottom-right)
            [2, 4, 6]  // Diagonal (top-right to bottom-left)
        ];

        // --- Core Game Logic Functions ---

        /**
         * Handles a cell click event.
         * @param {Event} clickedCellEvent - The event object from the click.
         */
        function handleCellClick(clickedCellEvent) {
            const clickedCell = clickedCellEvent.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // Check if the cell is already played or the game is over
            if (board[clickedCellIndex] !== '' || !isGameActive) {
                return;
            }

            // Update the game state
            board[clickedCellIndex] = currentPlayer;
            clickedCell.innerHTML = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase()); // Add class for styling

            // Check for win or draw
            handleResultValidation();
        }

        /**
         * Checks if the current move results in a win or a draw.
         */
        function handleResultValidation() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const winCondition = winningConditions[i];
                let a = board[winCondition[0]];
                let b = board[winCondition[1]];
                let c = board[winCondition[2]];

                // Skip if any cell in the condition is empty
                if (a === '' || b === '' || c === '') {
                    continue;
                }

                // Check for a match
                if (a === b && b === c) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.innerHTML = `Player ${currentPlayer} has won! 🎉`;
                isGameActive = false;
                return;
            }

            // Check for a Draw (if there are no empty cells left)
            let roundDraw = !board.includes('');
            if (roundDraw) {
                statusDisplay.innerHTML = 'Game ended in a draw! 🤝';
                isGameActive = false;
                return;
            }

            // If no win or draw, switch players
            changePlayer();
        }

        /**
         * Switches the current player and updates the status display.
         */
        function changePlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusDisplay.innerHTML = `Player ${currentPlayer}'s turn`;
        }

        /**
         * Resets the game to its initial state.
         */
        function handleRestartGame() {
            isGameActive = true;
            currentPlayer = 'X';
            board = ['', '', '', '', '', '', '', '', ''];
            statusDisplay.innerHTML = `Player ${currentPlayer}'s turn`;

            // Clear the board visually
            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('x', 'o');
            });
        }


        // --- Event Listeners ---
        
        // Ensure the DOM is fully loaded before attaching listeners (optional, but good practice)
        document.addEventListener('DOMContentLoaded', () => {
            // Attach the click handler to each cell
            cells.forEach(cell => cell.addEventListener('click', handleCellClick));

            // Attach the restart handler to the reset button
            resetButton.addEventListener('click', handleRestartGame);
        });

    </script>
</body>
</html>
