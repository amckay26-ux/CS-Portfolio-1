<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Base Binary Counter</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: #2c3e50; }
        
        .display-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #eef2f3; padding: 15px; border-radius: 8px; text-align: center; }
        .card label { display: block; font-size: 0.8rem; color: #7f8c8d; text-transform: uppercase; margin-bottom: 5px; }
        .card div { font-family: 'Courier New', Courier, monospace; font-size: 1.4rem; font-weight: bold; color: #2980b9; word-break: break-all; }
        .full-width { grid-column: span 2; }

        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 1rem; cursor: pointer; border: none; border-radius: 5px; transition: 0.2s; }
        .btn-inc { background: #27ae60; color: white; }
        .btn-reset { background: #e74c3c; color: white; }
        .btn-auto { background: #3498db; color: white; width: 100%; }
        button:hover { opacity: 0.9; }
        button:active { transform: translateY(1px); }
        
        .settings { margin-top: 15px; text-align: center; font-size: 0.9rem; }
        input[type="number"] { width: 60px; padding: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Multi-Base Counter</h2>

    <div class="display-grid">
        <div class="card full-width">
            <label>Binary (Base-2)</label>
            <div id="bin-out">00000000</div>
        </div>
        <div class="card">
            <label>Decimal (Base-10)</label>
            <div id="dec-out">0</div>
        </div>
        <div class="card">
            <label>Octal (Base-8)</label>
            <div id="oct-out">0</div>
        </div>
        <div class="card">
            <label>Hexadecimal</label>
            <div id="hex-out">0</div>
        </div>
        <div class="card">
            <label>Base-16</label>
            <div id="b16-out">0</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-inc" onclick="increment()">Manual Increment (+1)</button>
        <button class="btn-reset" onclick="reset()">Reset</button>
        <button id="auto-btn" class="btn-auto" onclick="toggleAuto()">Start Auto Counter</button>
    </div>

    <div class="settings">
        Interval: <input type="number" id="speed" value="500" min="50"> ms
    </div>
</div>

<script>
    let count = 0;
    let timer = null;

    function updateDisplay() {
        document.getElementById('dec-out').innerText = count;
        document.getElementById('bin-out').innerText = count.toString(2).padStart(8, '0');
        document.getElementById('oct-out').innerText = count.toString(8);
        document.getElementById('hex-out').innerText = count.toString(16).toUpperCase();
        document.getElementById('b16-out').innerText = count.toString(16).toUpperCase();
    }

    function increment() {
        count++;
        updateDisplay();
    }

    function reset() {
        count = 0;
        stopAuto();
        updateDisplay();
    }

    function toggleAuto() {
        if (timer) {
            stopAuto();
        } else {
            const speed = document.getElementById('speed').value;
            timer = setInterval(increment, speed);
            document.getElementById('auto-btn').innerText = "Stop Auto Counter";
            document.getElementById('auto-btn').style.background = "#f39c12";
        }
    }

    function stopAuto() {
        clearInterval(timer);
        timer = null;
        document.getElementById('auto-btn').innerText = "Start Auto Counter";
        document.getElementById('auto-btn').style.background = "#3498db";
    }
</script>

</body>
</html>
